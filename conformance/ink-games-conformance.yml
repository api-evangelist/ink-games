standards:
  - id: graphql
    name: GraphQL (June 2018 / October 2021 spec)
    conforms: true
    method: probed
    evidence: >-
      https://webadm.inkgames.com/graphql answers the spec-defined __schema
      introspection query with a conformant result (HTTP 200), returns the spec
      `errors[]` envelope with `message`, `path` and `extensions`, and exposes
      Query and Mutation root types. 165 types, 29 query fields, 37 mutation fields.

  - id: graphql-introspection
    name: GraphQL introspection enabled
    conforms: true
    method: probed
    evidence: 'POST {"query":"{__schema{queryType{name}}}"} -> HTTP 200 with a full schema response.'
    note: >-
      Positive for discoverability — the contract is machine-readable without
      credentials. Many production deployments disable this.

  - id: relay-connections
    name: Relay Cursor Connections Specification
    conforms: false
    method: derived
    evidence: >-
      The `*_connection` fields return { nodes, pageInfo } where pageInfo is
      { total, page, pageSize, pageCount }. There are no edges, no cursor, no
      endCursor and no hasNextPage, so this is Strapi offset pagination named after
      the connection pattern, not the Relay specification.

  - id: rfc9457
    name: RFC 9457 Problem Details for HTTP APIs
    conforms: false
    method: probed
    evidence: >-
      No surface returns application/problem+json. Three proprietary envelopes were
