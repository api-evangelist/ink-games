domain_standards:
  checked: true
  market: mobile gaming / consumer rewards + payouts
  result: none-declared
  note: >-
    REWARD-ONLY check, and INK Games earns nothing here — which is not a penalty. The
    published contract is a website content model; it declares no domain standard of
    any market. Specifically probed for and NOT found: no SCIM schema URN, no OData
    $metadata surface, no OpenRTB bid endpoint, no ActivityPub actor, no OAI-PMH verb,
    no ISO-20022/X12/EDIFACT/HL7 message type, no LTI/OneRoster shape. The gaming and
    payouts domain vocabularies a company of this shape could plausibly declare
    (IAB/OpenRTB for ad monetization, ISO 20022 for payout rails) appear nowhere in
    the schema or on any public page.
  candidates_probed:
    - { standard: OpenRTB, found: false, where: 'graphql schema, all hosts' }
    - { standard: 'ISO 20022', found: false, where: 'graphql schema, all hosts' }
    - { standard: SCIM, found: false, where: 'graphql schema (usersPermissions* types are Strapi-native, not SCIM)' }
    - { standard: OData, found: false, where: 'all hosts, no $metadata' }

compliance_program:
