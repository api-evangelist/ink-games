aid: ink-games
name: INK Games
description: >-
  INK Games is an Austin, Texas gaming company building a free-to-earn mobile gaming
  and social platform under the banner "Play. Win. Earn." Its flagship title is Prize
  Kingdoms, a mobile kingdom-building game distributed through the Apple App Store and
  Google Play in which players compete and earn real cash prizes. Two platform
  services sit behind the games: Ink ID, the single account and passkey-based
  authentication layer, and InkPay, the payments and earnings system that pays players
  and influencers ongoing royalties tied to the reach of their personal INK referral
  code. The team is drawn from EA, Zynga, SciPlay and Buffalo Studios. INK Games
  operates no public developer program — it publishes no developer portal, API
  reference, SDK or specification, and its shares trade only on private secondary
  markets.
