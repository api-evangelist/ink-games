apis:
- aid: ink-games-web-content-graphql
  name: INK Games Web Content GraphQL API
  description: >-
    The GraphQL contract served by INK Games' Strapi headless CMS, which supplies the
    content rendered on www.inkgames.com. Schema introspection is enabled and
    unauthenticated, so the complete type system — 165 types, 29 query fields, 37
    mutations across the Home, Games, Studio, Support, InkPay, Global, NotFound and
    StandardPage content types — is publicly readable. Every data resolver, however,
    returns "Forbidden access" to anonymous callers: the shape of the API is public,
    the data is not. This is the website's content backend, not a product INK Games
    offers for third-party integration, and INK Games publishes no documentation for
    it.
  humanURL: https://www.inkgames.com/
  baseURL: https://webadm.inkgames.com/graphql
  tags:
  - GraphQL
  - Content Management
  - Website
